# One Deployment PER RELEASE. No ConfigMap and no Secret: the page is static and its only
# configuration (gateway URL, commit) is baked into the bundle at build time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${NAME}-${COMMIT}
  labels:
    app: ${NAME}
    commit: "${COMMIT}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${NAME}
      commit: "${COMMIT}"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ${NAME}
        commit: "${COMMIT}"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ${NAME}
          image: ${IMAGE}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
