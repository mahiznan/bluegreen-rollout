# The gateway is a SINGLE release: one stable Deployment. The selector uses app only, so a new
# commit (new image, new ConfigMap name) is a hardened rolling update of the same Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${NAME}
  labels:
    app: ${NAME}
    commit: "${COMMIT}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${NAME}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ${NAME}
        commit: "${COMMIT}"
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: ${NAME}
          image: ${IMAGE}
          ports:
            - name: http
              containerPort: 8080
          # Settings from this release's ConfigMap (the gateway has no secret)
          envFrom:
            - configMapRef:
                name: ${NAME}-${COMMIT}-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
